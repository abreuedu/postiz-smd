# Compila a imagem amd64 (arquitetura da VPS) quando sai uma tag v*-smd.* e publica em ghcr.io/abreuedu/postiz-smd.
name: image
on:
  push:
    tags: ['v*-smd.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ github.ref_name }} \
            --provenance=false --sbom=false \
            -t ghcr.io/abreuedu/postiz-smd:${{ github.ref_name }} --push .
